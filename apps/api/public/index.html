<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Data Room API</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #111;
        --muted: #666;
        --bg: #fff;
        --line: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ededed;
          --muted: #a1a1a1;
          --bg: #0a0a0a;
          --line: #262626;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.05rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
      }
      hr {
        margin: 1.25rem 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Data Room API</h1>
      <p>This host serves the JSON API. There is no browser interface here.</p>
      <hr />
      <p>
        Health check: <code>GET /auth/me</code> answers <code>401</code> when no session is
        supplied.
      </p>
    </main>
  </body>
</html>
